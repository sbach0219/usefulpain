name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build arm64 app
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict dist/usefulpain.app
          test "$(lipo -archs dist/usefulpain.app/Contents/MacOS/usefulpain)" = arm64
          plutil -lint dist/usefulpain.app/Contents/Info.plist
